<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allenjo.in</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: #E3DDD1; /* Light beige matching the image */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #232323;
        }
        
        .main-container {
            width: 90%;
            max-width: 1000px;
            min-height: 500px;
            border: 1px solid #333;
            display: flex;
            padding: 40px;
            gap: 40px;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .text-content h1 {
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            font-weight: 700;
            letter-spacing: -1px;
            color: #232323;
        }

        .text-content p {
            font-size: 1.3rem;
            margin: 0;
            font-weight: 300;
            color: #333;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            color: #232323;
            text-decoration: none;
            transition: opacity 0.3s ease;
            display: inline-flex;
        }

        .social-icons a:hover {
            opacity: 0.6;
        }

        .social-icons svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .right-column {
            flex: 0 0 40%; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .right-column img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
                padding: 20px;
            }
            .right-column {
                width: 100%;
                margin-top: 30px;
            }
            .text-content h1 {
                font-size: 3rem;
            }
            .text-content p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">

            <div class="text-content">
                <h1>ALLEN</h1>

        <!-- Right Side: Image -->

            <img src="your-picture.jpg" alt="Allen">

    </div>
</body>
</html>
